<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Wardrobe Planner · Abhishek weds Yukta</title>
<meta name="description" content="What to wear for each function — Abhishek & Yukta, 22–25 November 2026, Jhalawar." />
<meta name="theme-color" content="#FBF3E8" />
<meta property="og:title" content="Wardrobe Planner · Abhishek weds Yukta" />
<meta property="og:description" content="What to wear for each function, 22–25 November 2026." />
<meta property="og:image" content="https://abhishekwedsyukta.vercel.app/assets/planner/1.jpg" />
<link rel="icon" href="assets/logo.png" />
<style>
@font-face{font-family:'Satoshi';src:url('assets/fonts/Satoshi-400.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Satoshi';src:url('assets/fonts/Satoshi-700.woff2') format('woff2');font-weight:700;font-display:swap}
:root{--paper:#FBF3E8;--ink:#33131C;--mute:#8A6C74;--rose:#8E1F3C;--rose-dp:#65132A;--line:rgba(94,38,48,.14)}
*{box-sizing:border-box}
body{margin:0;padding:16px 16px 40px;background:var(--paper);color:var(--ink);
  font-family:'Satoshi',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto}
.crest{display:block;width:clamp(210px,62vw,300px);height:auto;margin:6px auto 2px}
h1{font-size:clamp(22px,5.4vw,30px);font-weight:700;letter-spacing:-.02em;text-align:center;margin:10px 0 4px}
.sub{text-align:center;font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin:0 0 20px}
.page{width:100%;height:auto;display:block;border-radius:14px;margin:0 0 16px;box-shadow:0 10px 26px rgba(94,38,48,.12);border:1px solid var(--line)}
.bar{display:flex;gap:11px;justify-content:center;flex-wrap:wrap;margin:22px 0 0}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 24px;border-radius:999px;text-decoration:none;
  font-size:12.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;border:1px solid transparent}
.btn-solid{background:linear-gradient(118deg,var(--rose),var(--rose-dp));color:#FFF0DF;box-shadow:0 10px 24px rgba(101,19,42,.24)}
.btn-line{background:#fff;color:var(--rose);border-color:var(--line)}
.note{text-align:center;font-size:13px;color:var(--mute);margin:18px 0 0}
</style>
</head>
<body>
<div class="wrap">
  <img class="crest" src="assets/crest.png" alt="Abhishek and Yukta" width="390" height="336" />
  <h1>Wardrobe Planner</h1>
  <p class="sub">Abhishek &amp; Yukta · 22–25 November 2026</p>

  <img class="page" src="assets/planner/1.jpg" alt="Wardrobe planner, page 1" width="760" height="1351" />
  <img class="page" src="assets/planner/2.jpg" alt="Wardrobe planner, page 2" width="760" height="1351" loading="lazy" />
  <img class="page" src="assets/planner/3.jpg" alt="Wardrobe planner, page 3" width="760" height="1351" loading="lazy" />
  <img class="page" src="assets/planner/4.jpg" alt="Wardrobe planner, page 4" width="760" height="1351" loading="lazy" />

  <div class="bar">
    <a class="btn btn-solid" href="assets/wardrobe-planner.pdf" target="_blank" rel="noopener">Download the PDF</a>
    <a class="btn btn-line" href="./">← Back to the invitation</a>
  </div>
  <p class="note">Save the pages to your phone, or send the PDF on to whoever is packing for you.</p>
</div>
</body>
</html>
